<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>コードトーン トレーニング - KUROHON ver5</title>
  <!-- Google Fonts (Outfit, Playfair Display, Shippori Mincho, Noto Serif JP) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;600;700;900&family=Outfit:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,600;0,700;0,900;1,600;1,700;1,900&family=Shippori+Mincho:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div class="app-container">
    <!-- ヘッダー -->
    <header class="app-header">
      <div class="brand-logo">
        <span class="brand-icon">🎵</span>
        <h1>コードトーン トレーニング</h1>
      </div>
      
      <!-- 練習モード切り替えタブ -->
      <div class="mode-switch-group">
        <button id="mode-auto" class="btn-mode active" title="一定テンポで自動進行">🎵 自動進行</button>
        <button id="mode-mic" class="btn-mode" title="楽器の音をマイクで検出して合格で次へ進む">🎤 マイク音判定</button>
        <button id="mode-fretgame" class="btn-mode" title="指板図をタップして度数を当てるゲーム">🎮 指板当て</button>
      </div>

      <div class="brand-subtitle" style="color: var(--text-muted); font-size: 0.9rem;">
        黒本 ver5 (全275曲 A〜Z) 対応
      </div>
    </header>


    <!-- 1. 設定パネル -->
    <section class="controls-bar settings-panel">
      <!-- テンポ (BPM) -->
      <div class="metronome-control">
        <span style="font-weight: 700; color: var(--text-muted);">BPM</span>
        <div class="bpm-buttons">
          <button id="bpm-minus-10" class="btn-bpm" title="-10 (10刻みの数値に丸め)">-10</button>
          <button id="bpm-minus-1" class="btn-bpm">-1</button>
        </div>
        <input type="range" id="bpm-slider" min="40" max="240" value="60" />
        <div class="bpm-buttons">
          <button id="bpm-plus-1" class="btn-bpm">+1</button>
          <button id="bpm-plus-10" class="btn-bpm" title="+10 (10刻みの数値に丸め)">+10</button>
        </div>
        <span id="bpm-val" class="bpm-display">60</span>
      </div>

      <!-- 移調 (Transposition) -->
      <div class="select-group">
        <label for="transpose-select">🔑 移調 (Key):</label>
        <select id="transpose-select">
          <option value="-6">-6 半音</option>
          <option value="-5">-5 半音</option>
          <option value="-4">-4 半音</option>
          <option value="-3">-3 半音</option>
          <option value="-2">-2 半音</option>
          <option value="-1">-1 半音</option>
          <option value="0" selected>原曲キー (±0)</option>
          <option value="1">+1 半音</option>
          <option value="2">+2 半音</option>
          <option value="3">+3 半音</option>
          <option value="4">+4 半音</option>
          <option value="5">+5 半音</option>
          <option value="6">+6 半音</option>
        </select>
      </div>

      <!-- 度数選択 ＆ ドラッグ並び替え -->
      <div class="degree-selector-wrapper">
        <div class="degree-toggle-group">
          <span class="control-label">🎯 表示度数選択:</span>
          <div class="degree-buttons">
            <button class="btn-degree active" data-degree="R" id="btn-deg-R">R</button>
            <button class="btn-degree active" data-degree="3" id="btn-deg-3">3</button>
            <button class="btn-degree active" data-degree="5" id="btn-deg-5">5</button>
            <button class="btn-degree active" data-degree="7" id="btn-deg-7">7</button>
          </div>
        </div>
        <div class="degree-sort-group">
          <span class="control-label">⇄ 出順並び替え (ドラッグ可):</span>
          <div id="degree-sortable-list" class="degree-sortable-list">
            <!-- JSで動的に並び替えチップを生成 -->
          </div>
        </div>
      </div>

      <!-- 開始フレット & 表示フレット数設定 (数値直接入力) -->
      <div class="select-group">
        <label for="fret-start-input">🎸 開始フレット:</label>
        <input type="number" id="fret-start-input" min="0" max="21" value="0" class="input-fret-number" title="0 (開放〜) からの開始フレット数を入力" />
      </div>

      <div class="select-group">
        <label for="fret-count-input">📏 表示フレット数:</label>
        <input type="number" id="fret-count-input" min="1" max="24" value="5" class="input-fret-number" title="表示するフレット数を入力 (デフォルト 5)" />
      </div>

      <!-- カウントイン -->
      <div class="select-group">
        <label for="countin-select">⏱ カウントイン:</label>
        <select id="countin-select">
          <option value="4" selected>4拍 (デフォルト)</option>
          <option value="8">8拍</option>
          <option value="0">オフ (0拍)</option>
        </select>
      </div>

      <div class="select-group">
        <label>
          <input type="checkbox" id="toggle-fretboard" />
          🎸 ギター指板表示
        </label>
      </div>
      <div class="select-group">
        <label>
          <input type="checkbox" id="toggle-backing" checked />
          🎹 バッキング和音再生
        </label>
      </div>
      <div class="select-group">
        <label>
          <input type="checkbox" id="toggle-hide-notes" />
          🙈 音名非表示 (ブラインド練習)
        </label>
      </div>
    </section>


    <!-- 2. 楽曲検索 & 曲選択 & アクションバー -->
    <section class="song-action-panel">
      <div class="song-select-row">
        <input type="text" id="song-search" class="search-input" placeholder="🔍 曲名/作曲者で検索..." />
        <select id="song-select" class="song-select">
          <!-- JSで275曲をA-Z順に注入 -->
        </select>
      </div>
      <div class="main-btn-group">
        <button id="btn-start" class="btn btn-primary btn-large">▶️ スタート</button>
        <button id="btn-reset" class="btn btn-secondary">🔄 リセット</button>
      </div>
    </section>

    <!-- 3. メインコンテンツ (コード画面 + 指板画面を優先して一画面に配置) -->
    <main class="main-workspace">
      <!-- 演奏 ＆ 指板統合カード -->
      <div class="card-panel primary-workspace-card">
        <div class="panel-title">
          <span>🎸 演奏 & 指板トレーニング</span>
          <span id="song-info-badge" style="color: var(--accent-cyan); font-weight: 600;">-</span>
        </div>

        <!-- 指板当てゲームモード用ステータスバー (スリム化: 不要な長文お題テキスト削除) -->
        <div id="fretgame-status-bar" class="fretgame-status-bar" style="display: none;">
          <div class="fretgame-info-left">
            <span class="fretgame-icon-badge">🎮</span>
            <span class="fretgame-mode-tag">指板当てゲーム進行中</span>
          </div>
          <div class="fretgame-progress-box">
            <span id="fretgame-progress-text" class="fretgame-progress-badge">正解: 0 / 4</span>
            <button id="fretgame-skip-btn" class="btn btn-secondary btn-small">⏭️ スキップ</button>
          </div>
        </div>

        <!-- マイク判定モード用リアルタイムステータスバー -->
        <div id="mic-status-bar" class="mic-status-bar" style="display: none;">
          <div class="mic-status-info">
            <span class="mic-icon-badge">🎤</span>
            <div class="mic-note-box">
              <span class="mic-label">目標音:</span>
              <span id="target-note-val" class="target-note-highlight">-</span>
            </div>
            <div class="mic-note-box">
              <span class="mic-label">検出音:</span>
              <span id="detected-note-val" class="detected-note-val">--</span>
            </div>
          </div>

          <div class="mic-controls-group">
            <div class="mic-sensitivity-control">
              <label for="mic-gain-slider" class="mic-label">🎚️ 感度: <span id="mic-gain-val" class="gain-val-display">200%</span></label>
              <input type="range" id="mic-gain-slider" min="50" max="500" step="10" value="200" />
            </div>
            <div class="mic-meter-box">
              <div class="mic-meter-track">
                <div id="mic-level-bar" class="mic-level-bar" style="width: 0%;"></div>
              </div>
            </div>
          </div>

          <button id="btn-toggle-mic" class="btn-mic-toggle">🎙️ マイク起動</button>
        </div>

        <!-- コード表示 ＆ 音名度数カードエリア -->
        <div class="chord-display-row">
          <div class="play-chord-box">
            <div id="countin-badge" class="countin-badge" style="display: none;">COUNT IN: 4</div>
            <div id="big-chord" class="big-chord-symbol">C</div>
            <div class="next-chord-preview">
              NEXT: <span id="next-chord" class="next-chord-val">-</span>
            </div>
          </div>

          <div class="tones-card-box">
            <div class="tones-header">
              <span>音名・度数ガイド</span>
            </div>
            <div id="chord-tones-container" class="chord-tones-grid">
              <!-- JSで音名と度数カードを動的注入 -->
            </div>
          </div>
        </div>

        <!-- ギター指板表示エリア (一画面に収まるようコード画面直下に配置) -->
        <section id="fretboard-container" class="fretboard-section">
          <!-- JSでギター指板を注入 -->
        </section>
      </div>

      <!-- リードシート (全小節コード進行: アコーディオン/折りたたみで一画面を圧迫しない) -->
      <details class="card-panel leadsheet-accordion" open>
        <summary class="panel-title accordion-summary">
          <span>📄 リードシート (全小節コード進行)</span>
          <span id="measure-progress-text" style="font-size: 0.9rem; color: var(--text-dim);">小節: 1 / --</span>
        </summary>
        <div id="leadsheet-container" class="leadsheet-content-box">
          <!-- JSで全小節カードを注入 -->
        </div>
      </details>
    </main>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
